[project]
name = "verdict-eval"
version = "0.0.1"
description = "Backtest & calibration harness (never in the serving path)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
