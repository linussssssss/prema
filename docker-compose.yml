# All ports bind to 127.0.0.1 deliberately. Every consumer (workers, CLIs, the
# API) runs on the same host, so nothing is lost — but on a public VPS a
# 0.0.0.0 binding would expose Postgres (verdict/verdict), MinIO, and an
# unauthenticated Redis to the internet. Open Redis is compromised in minutes:
# the standard attack writes an SSH key via CONFIG SET dir.
#
# This binding is what actually protects you, not a host firewall — Docker
# writes iptables rules directly and routinely bypasses ufw.
# `restart: unless-stopped` on every service is load-bearing, not boilerplate:
# unattended-upgrades reboots this box, and the recurring worker has to survive
# that. Without it the containers stay down after a reboot and the worker
# crash-loops against a database that will never come back.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: verdict
      MINIO_ROOT_PASSWORD: verdict-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
